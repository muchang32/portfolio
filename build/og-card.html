<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#FAF7F0;font-family:"Noto Sans TC","PingFang TC",sans-serif;color:#14110F;overflow:hidden;position:relative}
.pad{padding:62px 68px;height:100%;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:2}
.top{display:flex;align-items:center;gap:14px}
.top img{width:46px;height:46px}
.name{font-size:26px;font-weight:700;letter-spacing:-.01em}
.name span{opacity:.45;font-weight:500}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:17px;letter-spacing:.16em;color:#6B635B;margin-bottom:18px}
h1{font-size:92px;font-weight:900;line-height:1.16;letter-spacing:-.03em}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,#FFD34E 62%);padding:0 4px}
.tag{margin-top:22px;font-size:25px;color:#3B342E;line-height:1.6}
.foot{display:flex;align-items:center;justify-content:space-between}
.url{font-family:"IBM Plex Mono",monospace;font-size:19px;color:#6B635B}
.pills{display:flex;gap:10px}
.pill{border:2px solid #14110F;border-radius:999px;padding:8px 18px;font-size:17px;font-weight:700;background:#fff}
.pill.y{background:#FFD34E}
.blob{position:absolute;border-radius:50%;z-index:1}
.b1{width:430px;height:430px;background:#FFE9A8;right:-110px;top:-120px}
.b2{width:230px;height:230px;background:#CDBCFF;opacity:.5;right:130px;bottom:-90px}
.star{position:absolute;z-index:1;opacity:.9}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<img class="star" src="../assets/logo.png" style="width:150px;right:64px;top:150px">
<div class="pad">
  <div class="top"><img src="../assets/logo.png" alt=""><div class="name">張詩沂 <span>/ Shi-Yi Chang</span></div></div>
  <div>
    <div class="kicker">PRODUCT MANAGER · AI PRACTITIONER · DESIGNER</div>
    <h1>設計出身的<br><em>AI 產品人</em></h1>
    <div class="tag">10 年設計積累 × PM 實戰 × AI 工具應用</div>
  </div>
  <div class="foot">
    <div class="url">muchang32.github.io/portfolio</div>
    <div class="pills"><div class="pill y">2025 iF 設計獎</div><div class="pill">iPAS AI 應用規劃師</div></div>
  </div>
</div></body></html>
